<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suris EcoFlow Flow Card — Demo</title>
<style>body{margin:20px auto;padding:0 12px;max-width:1060px;background:#111;color:#eee;font:16px system-ui;--ha-card-background:#1c1c1c;--primary-text-color:#eee;--secondary-text-color:#aaa;--divider-color:#535861}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{background:#222;border:1px solid #666;color:#eee;padding:10px 14px;border-radius:8px;cursor:pointer}button:focus-visible{outline:2px solid #27d9d5}p{color:#aaa;font-size:13px}</style>
</head><body><nav><button data-mode="main">Дім від EcoFlow</button><button data-mode="grid">Дім від мережі</button><button data-mode="charging">Заряджання від мережі</button><button data-mode="unknown">Джерело недоступне</button></nav><suris-ecoflow-flow-card></suris-ecoflow-flow-card><p>Демонстраційні показники. Для встановлення відкрий README.md.</p>
<script src="./suris-ecoflow-flow-card.js"></script><script>
const card=document.querySelector('suris-ecoflow-flow-card');
const make=(value,unit='W')=>({state:String(value),attributes:{unit_of_measurement:unit}});
const states={};
const config={type:'custom:suris-ecoflow-flow-card',grid:{power:'sensor.grid',available_entity:'binary_sensor.grid',available_state:'on'},auxiliary_1:{soc:'sensor.a_soc',input_power:'sensor.a_in',output_power:'sensor.a_out'},auxiliary_2:{soc:'sensor.b_soc',input_power:'sensor.b_in',output_power:'sensor.b_out'},main:{soc:'sensor.m_soc',input_power:'sensor.m_in',output_power:'sensor.m_out',ac_input_power:'sensor.m_ac',solar_input_power:'sensor.m_pv'},home:{}};
card.setConfig(config);
function update(mode){
const charging=mode==='charging',grid=mode==='grid'||charging;
Object.assign(states,{'sensor.grid':make(grid?(charging?1250:320):0),'binary_sensor.grid':make(mode==='unknown'?'unavailable':grid?'on':'off'),'sensor.a_soc':make(68,'%'),'sensor.b_soc':make(81,'%'),'sensor.m_soc':make(74,'%'),'sensor.a_in':make(charging?300:0),'sensor.b_in':make(charging?330:0),'sensor.a_out':make(charging?0:150),'sensor.b_out':make(charging?0:200),'sensor.m_in':make(charging?300:330),'sensor.m_ac':make(charging?300:0),'sensor.m_pv':make(charging?0:330),'sensor.m_out':make(grid?0:320),'sensor.home':make(320)});
card.hass={states:{...states}};
}
document.querySelector('nav').addEventListener('click',e=>{if(e.target.dataset.mode)update(e.target.dataset.mode)});update('main');
</script></body></html>
