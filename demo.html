<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suris EcoFlow Flow Card 2.0.4 — Demo</title>
<style>body{margin:20px auto;padding:0 12px;max-width:1060px;background:#111;color:#eee;font:16px system-ui;--ha-card-background:#1c1c1c;--primary-text-color:#eee;--secondary-text-color:#aaa;--divider-color:#535861}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{background:#222;border:1px solid #666;color:#eee;padding:10px 14px;border-radius:8px;cursor:pointer}button:focus-visible{outline:2px solid #27d9d5}p{color:#aaa;font-size:13px}</style>
</head><body><nav><button data-mode="main">Дім від EcoFlow</button><button data-mode="aux3">Передача EcoFlow №3</button><button data-mode="grid">Дім від мережі</button><button data-mode="charging">Заряджання від мережі</button><button data-mode="replace">Заміна сильнішим приладом</button><button data-mode="single">Один ряд приладів</button><button data-mode="idle">Прилади вимкнені</button><button data-mode="unknown">Джерело недоступне</button></nav><suris-ecoflow-flow-card></suris-ecoflow-flow-card><p>Демонстраційні показники. Для встановлення відкрий README.md.</p>
<script src="./suris-ecoflow-flow-card.js"></script><script>
const card=document.querySelector('suris-ecoflow-flow-card');
const make=(value,unit='W')=>({state:String(value),attributes:{unit_of_measurement:unit}});
const states={'sensor.home_voltage':make(230,'V')};
const config={type:'custom:suris-ecoflow-flow-card',grid:{power:'sensor.grid',available_entity:'binary_sensor.grid',available_state:'on'},auxiliary_1:{soc:'sensor.a_soc',input_power:'sensor.a_in',output_power:'sensor.a_out'},auxiliary_2:{soc:'sensor.b_soc',input_power:'sensor.b_in',output_power:'sensor.b_out'},main:{soc:'sensor.m_soc',input_power:'sensor.m_in',output_power:'sensor.m_out',ac_input_power:'sensor.m_ac',solar_input_power:'sensor.m_pv',solar_input_power_2:'sensor.m_pv2'},home:{voltage:'sensor.home_voltage'},appearance:{auxiliary_2_color:'#ff8800'}};
const devices=[['boiler','Бойлер','mdi:water-boiler','#ff5570',1000],['kettle','Чайник','mdi:kettle','orange',600],['washer','Пральна','mdi:washing-machine','#875aff',250],['fridge','Холодильник','mdi:fridge','#16aebc',120],['lights','Освітлення','mdi:lightbulb','green',80],['sockets','Розетки','mdi:power-socket-eu','#5477dd',50],['oven','Духовка','mdi:stove','#f67530',30]];
config.consumers=devices.map(([id,name,icon,color])=>({id,name,icon,color,power:`sensor.${id}_power`}));
card.setConfig(config);
function update(mode){
const charging=mode==='charging',grid=['grid','charging','replace','single','idle'].includes(mode);
let homePower=0;for(const [id,name,icon,color,power]of devices){const watts=mode==='idle'||(mode==='single'&&!['boiler','kettle','washer'].includes(id))?0:mode==='replace'&&id==='oven'?1500:power;states[`sensor.${id}_power`]=make(watts);homePower+=watts;}
Object.assign(states,{'sensor.grid':make(grid?homePower+(charging?930:0):0),'binary_sensor.grid':make(mode==='unknown'?'unavailable':grid?'on':'off'),'sensor.a_soc':make(68,'%'),'sensor.b_soc':make(81,'%'),'sensor.m_soc':make(74,'%'),'sensor.a_in':make(charging?300:0),'sensor.b_in':make(charging?330:0),'sensor.a_out':make(!charging&&mode!=='aux3'?350:0),'sensor.b_out':make(!charging&&mode==='aux3'?350:0),'sensor.m_in':make(charging?300:330),'sensor.m_ac':make(charging?300:0),'sensor.m_pv':make(charging?0:230),'sensor.m_pv2':make(charging?0:100),'sensor.m_out':make(grid?0:homePower),'sensor.home':make(homePower)});
card.hass={states:{...states}};
}
document.querySelector('nav').addEventListener('click',e=>{if(e.target.dataset.mode)update(e.target.dataset.mode)});update('grid');
</script></body></html>
