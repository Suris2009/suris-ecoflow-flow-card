name: Verify beta before release
on:
  push:
    branches: ['beta/**']
    paths: ['package.json', 'suris-ecoflow-flow-card.js', 'tests/**', '.github/workflows/beta-release.yml']
permissions:
  contents: read
concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate beta source
        run: |
          node --check suris-ecoflow-flow-card.js
          node tests/verify-model.cjs
          node scripts/validate-release.cjs
          node -e 'if (!/^[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$/.test(require("./package.json").version)) process.exit(1)'
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: npm test
