name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact package version, without v'
        required: true
        default: '0.1.0'
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate release source
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --check suris-ecoflow-flow-card.js
          node tests/verify-model.cjs
          node scripts/validate-release.cjs
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          sha256sum suris-ecoflow-flow-card.js > SHA256SUMS.txt
          RELEASE_FLAGS=()
          if [[ "$VERSION" == *-beta.* ]]; then RELEASE_FLAGS+=(--prerelease --latest=false); fi
          gh release create "v${VERSION}" suris-ecoflow-flow-card.js SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Suris EcoFlow Flow Card ${VERSION}" \
            --notes-file CHANGELOG.md "${RELEASE_FLAGS[@]}"
